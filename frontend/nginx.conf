server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cho load balancer / orchestrator kiểm tra container còn sống
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # File build có hash trong tên -> cache lâu
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html không được cache, để người dùng luôn nhận bản mới
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: mọi đường dẫn khác trả về index.html để React Router xử lý
    location / {
        try_files $uri /index.html;
    }
}
