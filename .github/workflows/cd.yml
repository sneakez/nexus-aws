name: CD - Publish backend image

# Chạy khi code vào main hoặc khi gắn tag phiên bản vX.Y.Z.
# Quy trình: chạy lại toàn bộ test (CI) -> chỉ khi CẢ HAI xanh mới build và đẩy backend image.
# Frontend được triển khai riêng lên S3 + CloudFront trong workflow AWS.
# Sản phẩm: backend Docker image đẩy lên GitHub Container Registry (ghcr.io).
# Chưa triển khai lên AWS: khi sẵn sàng chỉ cần thêm job "deploy" dùng image này.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Cổng kiểm tra: dùng lại đúng workflow CI của PR
  frontend-ci:
    name: Frontend CI
    uses: ./.github/workflows/frontend-ci.yml
  backend-ci:
    name: Backend CI
    uses: ./.github/workflows/backend-ci.yml

  publish:
    name: Publish backend
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tự sinh tag: sha ngắn (truy vết), tên nhánh, phiên bản semver, và latest cho main
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
