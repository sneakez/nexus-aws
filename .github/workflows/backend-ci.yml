name: Backend CI

# Chạy trên mỗi PR. Trên main/tag, cd.yml gọi lại workflow này (workflow_call)
# làm "cổng kiểm tra" trước khi phát hành image, nên không cần trigger push ở đây.
on:
  pull_request:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  workflow_call:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore NexusOMS.slnx
      - run: dotnet build src/NexusOMS.Api/NexusOMS.Api.csproj --configuration Release --no-restore
      - run: dotnet test tests/NexusOMS.ApiTests/NexusOMS.ApiTests.csproj --configuration Release --no-restore --verbosity normal

  docker-build:
    name: Docker image builds
    needs: build-and-test
    # Chỉ build thử trên PR. Trên main, cd.yml sẽ build thật rồi đẩy image.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
