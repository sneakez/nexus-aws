name: Frontend CI

# Chạy trên mỗi PR. Trên main/tag, cd.yml gọi lại workflow này (workflow_call)
# làm "cổng kiểm tra" trước khi phát hành image, nên không cần trigger push ở đây.
on:
  pull_request:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  workflow_call:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Typecheck, Lint, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:live
      # TODO: hiện còn ~250 lỗi lint tồn đọng (unused-vars, no-explicit-any).
      # Để không chặn merge, tạm cho phép fail; xóa continue-on-error khi đã dọn xong.
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      - run: npm run build

  docker-build:
    name: Docker image builds
    needs: quality-gate
    # Chỉ build thử trên PR. Trên main, cd.yml sẽ build thật rồi đẩy image.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Chỉ build để chắc chắn Dockerfile không hỏng, không push.
      - uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
