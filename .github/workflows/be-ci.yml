name: Backend CI

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'be/**' # Chỉ kích hoạt khi có thay đổi trong thư mục be/

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./be

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore NexusOMS.sln

    - name: Build
      run: dotnet build NexusOMS.sln --configuration Release --no-restore

    - name: Run Unit Tests
      # Chạy các test project đã định nghĩa trong cấu trúc
      run: |
        dotnet test tests/NexusOMS.UnitTests/NexusOMS.UnitTests.csproj --configuration Release --no-build --verbosity normal
        dotnet test tests/NexusOMS.IntegrationTests/NexusOMS.IntegrationTests.csproj --configuration Release --no-build --verbosity normal